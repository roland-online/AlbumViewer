# Run docker-compose build
# Run docker-compose up
# Live long and prosper
#
# Single self-contained container: the .NET app serves both the API and the
# Angular build directly (MapStaticAssets + MapFallbackToFile), and SQLite is
# the zero-config default (appsettings.json Data:Provider) — no separate nginx
# reverse proxy or external database needed.

services:
  aspnet:
    container_name: 'westwindalbumviewer'
    image: 'rickstrahl/albumviewer:albumviewer'
    build:
      context: .
      dockerfile: src/AlbumViewerNetCore/Dockerfile
    ports:
      - "5000:8080"
