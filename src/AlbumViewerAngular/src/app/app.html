<mat-toolbar>
  <a class="brand" routerLink="/albums">
    <img src="images/headphone-head.png" alt="AlbumViewer" />
    <span class="brand-text">
      <span class="brand-sub">West Wind</span>
      AlbumViewer
    </span>
  </a>

  <a mat-button routerLink="/albums" routerLinkActive="active">
    <mat-icon>album</mat-icon> <span class="nav-label">Albums</span>
  </a>
  <a mat-button routerLink="/artists" routerLinkActive="active">
    <mat-icon>group</mat-icon> <span class="nav-label">Artists</span>
  </a>
  <a mat-button routerLink="/options" routerLinkActive="active">
    <mat-icon>settings</mat-icon> <span class="nav-label">Options</span>
  </a>

  @if (appConfig.isSearchAllowed()) {
    <input class="toolbar-search"
           type="text"
           placeholder="Search..."
           [ngModel]="appConfig.searchText()"
           (ngModelChange)="appConfig.searchText.set($event)" />
  }

  <span class="toolbar-spacer"></span>

  @if (auth.isAuthenticated()) {
    <button mat-button (click)="logout()">
      <mat-icon>lock</mat-icon> <span class="nav-label">Logout</span>
    </button>
  } @else {
    <a mat-button routerLink="/login">
      <mat-icon>lock_open</mat-icon> <span class="nav-label">Login</span>
    </a>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
